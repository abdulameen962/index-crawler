version: "1"
services:
  # Web Service: FastAPI Application & Single-Page Replicator Dashboard (100% Free Plan)
  - type: web
    name: ngx-index-calculator
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: TIMEZONE
        value: Africa/Lagos
      - key: CRON_SECRET
        generateValue: true

