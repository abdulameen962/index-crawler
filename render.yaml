version: "1"
services:
  # 1. Web Service: FastAPI Application & Single-Page Dashboard
  - type: web
    name: ngx-index-calculator
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: TIMEZONE
        value: Africa/Lagos
      - key: CRON_SECRET
        generateValue: true

  # 2. Scheduled EOD Background Crawler: Mon-Fri 6:00 PM WAT (17:00 UTC)
  - type: cron
    name: ngx-eod-crawler-cron
    runtime: python
    region: frankfurt
    plan: free
    schedule: "0 17 * * 1-5"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python trigger_eod_crawl.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: CRON_SECRET
        fromService:
          type: web
          name: ngx-index-calculator
          envVarKey: CRON_SECRET
      - key: WEB_SERVICE_URL
        fromService:
          type: web
          name: ngx-index-calculator
          property: host
