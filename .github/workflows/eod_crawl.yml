name: Daily EOD Price Crawler

on:
  schedule:
    # Runs Monday to Friday at 15:30 UTC (4:30 PM West Africa Time - after market close)
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  crawl-eod-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NGX Spiders
        run: |
          python crawler_runner.py

      - name: Commit and push updated index fund datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index_funds/*.json
          if git diff --staged --quiet; then
            echo "No price updates detected."
          else
            git commit -m "chore(data): auto-update NGX index constituent closing prices [skip ci]"
            git push
          fi
